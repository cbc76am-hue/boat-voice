title: Tolly
views:
  - title: Tolly
    path: tolly
    icon: mdi:sail-boat
    cards:
      - type: vertical-stack
        cards:
          - type: button
            name: Talk to Tolly
            icon: mdi:microphone
            icon_height: 90px
            show_name: true
            show_icon: true
            tap_action:
              action: call-service
              service: rest_command.tolly_talk
              data: {}

          - type: entities
            title: Conversation
            entities:
              - entity: input_boolean.tolly_conversation_mode
                name: Conversation mode (hands-free)

          - type: entity
            entity: binary_sensor.tolly_healthy
            name: Tolly health
            icon: mdi:robot-happy

          - type: entities
            title: Service health detail
            show_header_toggle: false
            entities:
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: mic
                name: Microphone
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: speaker
                name: Speaker
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: ha_reachable
                name: HA reachable
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: gemini_reachable
                name: Gemini reachable
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: model
                name: Model in use
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: model_valid
                name: Model valid
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: exposed_entity_count
                name: Exposed entities
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: conv_mode_active
                name: Conversation mode active
              - type: attribute
                entity: binary_sensor.tolly_healthy
                attribute: uptime_s
                name: Service uptime (s)

          - type: entities
            title: Boat — Signal K
            show_header_toggle: false
            entities:
              - sensor.boat_speed_over_ground
              - sensor.depth_below_keel
              - sensor.water_temperature
              - sensor.wind_speed_apparent
              - sensor.wind_angle_apparent
              - sensor.house_battery_voltage
